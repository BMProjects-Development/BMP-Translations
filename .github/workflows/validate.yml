name: Validate resource packs

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run release-tool tests
        run: python -m unittest discover -s tests -v

      - name: Validate all resource packs
        run: python scripts/release_tools.py validate

      - name: Test reproducible builds
        run: python scripts/release_tools.py build --all --output dist

